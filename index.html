    <style>
        body {
            background-color: #09090B;
            color: #E4E4E7;
            overflow-x: hidden;
            font-family: 'Inter', sans-serif;
        }
        .font-heading { fontFamily: 'Space Grotesk', sans-serif; }
        
        .gradient-text-mono {
            background: linear-gradient(135deg, #FFFFFF 0%, #A1A1AA 50%, #52525B 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .mono-border {
            position: relative;
            background: #121215;
            border-radius: 1rem;
            border: 1px solid #27272A;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            overflow: hidden;
        }
        .mono-border:hover {
            border-color: #A1A1AA;
            box-shadow: 0 10px 30px -10px rgba(255, 255, 255, 0.08);
            transform: translateY(-2px);
        }

        .slide-container {
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            height: 100vh;
        }
        .slide {
            scroll-snap-align: start;
            min-height: 100vh;
        }
        
        /* Glassmorphism Monochrome */
        .glass-mono {
            background: rgba(18, 18, 21, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 5px;
        }
        ::-webkit-scrollbar-track {
            background: #09090B;
        }
        ::-webkit-scrollbar-thumb {
            background: #27272A;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #71717A;
        }

        /* PRINT STYLES FOR EXPORT TO PDF */
        @media print {
            @page {
                size: A4 landscape;
                margin: 0;
            }
            header {
                display: none !important;
            }
            body, html {
                height: auto !important;
                overflow: visible !important;
                background-color: #09090B !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            .slide-container {
                height: auto !important;
                overflow: visible !important;
                display: block !important;
                scroll-snap-type: none !important;
            }
            .slide {
                min-height: 100vh !important;
                height: 100vh !important;

                align-items: center !important;
                justify-content: center !important;
                box-sizing: border-box !important;
                padding: 2rem !important;

            * {

        }

    <!-- Interactive Script -->
    <script>
        const slideContainer = document.getElementById('slideContainer');
        
        function scrollToSlide(index) {
            const slides = document.querySelectorAll('.slide');
            if (slides[index]) {
                slides[index].scrollIntoView({ behavior: 'smooth' });
            }
        }

        // Calculator Logic
        const range = document.getElementById('budgetRange');
        const budgetVal = document.getElementById('budgetValue');
        const percentVal = document.getElementById('percentValue');
        const profitVal = document.getElementById('profitValue');

        range.addEventListener('input', (e) => {
            const val = parseInt(e.target.value);
            budgetVal.textContent = val.toLocaleString('ru-RU') + ' сомони';
            
            let percent = 15;
            if (val >= 100000 && val < 300000) percent = 20;
            if (val >= 300000 && val < 600000) percent = 25;
            if (val >= 600000) percent = 30;

            percentVal.textContent = percent + '%';
            const profit = Math.round(val * (percent / 100));
            profitVal.textContent = profit.toLocaleString('ru-RU') + ' сомони';
        });
    </script>
